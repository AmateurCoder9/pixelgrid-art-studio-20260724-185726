<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelGrid Art Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pixel-grid {
            display: grid;
            background-color: #e5e7eb;
            border: 2px solid #374151;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            touch-action: none;
        }
        .pixel {
            background-color: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            width: 100%;
            height: 100%;
        }
        .tool-btn.active {
            background-color: #4f46e5;
            color: white;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between font-sans select-none">

    <!-- Header -->
    <header class="w-full py-4 px-6 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-indigo-500 rounded flex items-center justify-center font-bold text-lg">P</div>
            <h1 class="text-xl font-bold tracking-wide">PixelGrid <span class="text-indigo-400 text-sm font-normal">Art Studio</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <button id="clearBtn" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-sm font-medium rounded transition">Clear</button>
            <button id="exportBtn" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-sm font-medium rounded transition shadow-lg shadow-indigo-600/30">Export PNG</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center p-6 gap-8 w-full max-w-6xl">
        
        <!-- Left Panel: Tools & Settings -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col gap-6 w-full lg:w-72 shadow-lg">
            
            <!-- Canvas Size -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Grid Size</label>
                <select id="gridSizeSelect" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="8">8 x 8</option>
                    <option value="16" selected>16 x 16</option>
                    <option value="24">24 x 24</option>
                    <option value="32">32 x 32</option>
                </select>
            </div>

            <!-- Tools -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tools</label>
                <div class="grid grid-cols-2 gap-2">
                    <button data-tool="pencil" class="tool-btn active py-2 px-3 bg-slate-700 text-sm rounded font-medium transition flex items-center justify-center gap-2">Pencil</button>
                    <button data-tool="eraser" class="tool-btn py-2 px-3 bg-slate-700 text-sm rounded font-medium transition flex items-center justify-center gap-2">Eraser</button>
                    <button data-tool="fill" class="tool-btn py-2 px-3 bg-slate-700 text-sm rounded font-medium transition flex items-center justify-center gap-2 col-span-2">Paint Bucket</button>
                </div>
            </div>

            <!-- Color Picker -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Primary Color</label>
                <div class="flex items-center gap-3">
                    <input type="color" id="colorPicker" value="#4f46e5" class="w-10 h-10 rounded cursor-pointer bg-transparent border-0">
                    <span id="hexVal" class="text-sm font-mono text-slate-300">#4f46e5</span>
                </div>
            </div>

            <!-- Palette -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Quick Palette</label>
                <div id="palette" class="grid grid-cols-6 gap-2">
                    <!-- Palette items injected via JS -->
                </div>
            </div>

        </div>

        <!-- Center: Canvas Viewport -->
        <div class="flex-1 flex items-center justify-center bg-slate-950/50 p-8 rounded-xl border border-slate-800 min-h-[400px] w-full overflow-auto">
            <div id="gridContainer">
                <div id="pixelGrid" class="pixel-grid"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 px-6 text-center text-xs text-slate-500 border-t border-slate-800">
        Click or drag to draw. Fully client-side pixel art creation tool.
    </footer>

    <!-- Script -->
    <script>
        const gridElement = document.getElementById('pixelGrid');
        const gridSizeSelect = document.getElementById('gridSizeSelect');
        const colorPicker = document.getElementById('colorPicker');
        const hexVal = document.getElementById('hexVal');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');
        const toolBtns = document.querySelectorAll('.tool-btn');
        const paletteContainer = document.getElementById('palette');

        let gridSize = parseInt(gridSizeSelect.value);
        let currentTool = 'pencil';
        let currentColor = colorPicker.value;
        let isMouseDown = false;

        const quickColors = [
            '#000000', '#ffffff', '#ef4444', '#f97316', '#f59e0b',
            '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#6366f1',
            '#a855f7', '#ec4899', '#78716c', '#64748b', '#475569'
        ];

        function initPalette() {
            paletteContainer.innerHTML = '';
            quickColors.forEach(color => {
                const btn = document.createElement('button');
                btn.className = 'w-8 h-8 rounded border border-slate-600 transition transform hover:scale-110';
                btn.style.backgroundColor = color;
                btn.addEventListener('click', () => {
                    currentColor = color;
                    colorPicker.value = color;
                    hexVal.textContent = color;
                });
                paletteContainer.appendChild(btn);
            });
        }

        function initGrid() {
            gridElement.innerHTML = '';
            gridElement.style.gridTemplateColumns = `repeat(${gridSize}, minmax(0, 1fr))`;
            gridElement.style.gridTemplateRows = `repeat(${gridSize}, minmax(0, 1fr))`;
            
            const size = Math.min(400, window.innerWidth - 100);
            gridElement.style.width = `${size}px`;
            gridElement.style.height = `${size}px`;

            for (let i = 0; i < gridSize * gridSize; i++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.dataset.index = i;
                
                pixel.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    isMouseDown = true;
                    applyTool(pixel);
                });
                
                pixel.addEventListener('mouseenter', () => {
                    if (isMouseDown) applyTool(pixel);
                });

                gridElement.appendChild(pixel);
            }
        }

        function applyTool(pixel) {
            if (currentTool === 'pencil') {
                pixel.style.backgroundColor = currentColor;
            } else if (currentTool === 'eraser') {
                pixel.style.backgroundColor = '#ffffff';
            } else if (currentTool === 'fill') {
                floodFill(pixel);
            }
        }

        function floodFill(startPixel) {
            const targetColor = startPixel.style.backgroundColor || 'rgb(255, 255, 255)';
            const replacementColor = hexToRgb(currentColor);
            
            if (targetColor === replacementColor) return;

            const pixels = Array.from(gridElement.children);
            const startIndex = parseInt(startPixel.dataset.index);
            const queue = [startIndex];
            const visited = new Set();

            while (queue.length > 0) {
                const currentIndex = queue.shift();
                if (visited.has(currentIndex)) continue;
                visited.add(currentIndex);

                const p = pixels[currentIndex];
                const pColor = p.style.backgroundColor || 'rgb(255, 255, 255)';

                if (pColor === targetColor || (targetColor === 'rgb(255, 255, 255)' && (pColor === '' || pColor === 'white'))) {
                    p.style.backgroundColor = currentColor;
                    
                    const x = currentIndex % gridSize;
                    const y = Math.floor(currentIndex / gridSize);

                    if (x > 0) queue.push(currentIndex - 1);
                    if (x < gridSize - 1) queue.push(currentIndex + 1);
                    if (y > 0) queue.push(currentIndex - gridSize);
                    if (y < gridSize - 1) queue.push(currentIndex + gridSize);
                }
            }
        }

        function hexToRgb(hex) {
            let bigint = parseInt(hex.replace('#', ''), 16);
            let r = (bigint >> 16) & 255;
            let g = (bigint >> 8) & 255;
            let b = bigint & 255;
            return `rgb(${r}, ${g}, ${b})`;
        }

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        gridSizeSelect.addEventListener('change', (e) => {
            gridSize = parseInt(e.target.value);
            initGrid();
        });

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            hexVal.textContent = currentColor;
        });

        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
            });
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to clear the canvas?')) {
                document.querySelectorAll('.pixel').forEach(p => p.style.backgroundColor = '#ffffff');
            }
        });

        exportBtn.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = gridSize;
            canvas.height = gridSize;
            const ctx = canvas.getContext('2d');

            const pixels = document.querySelectorAll('.pixel');
            pixels.forEach((pixel, index) => {
                const x = index % gridSize;
                const y = Math.floor(index / gridSize);
                const bgColor = pixel.style.backgroundColor;
                
                if (bgColor && bgColor !== 'rgba(0, 0, 0, 0)' && bgColor !== '') {
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(x, y, 1, 1);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x, y, 1, 1);
                }
            });

            const link = document.createElement('a');
            link.download = 'pixel-art.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Initialize App
        initPalette();
        initGrid();
    </script>
</body>
</html>
